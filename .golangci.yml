version: "2"

linters:
  enable:
    - errcheck      # every returned error checked or explicitly discarded
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - bodyclose     # every http.Response.Body closed
    - forbidigo     # no fmt.Print* in provider code
    - gosec         # security scan; workflow.md lists it in Stage 1 review scope

  settings:
    forbidigo:
      # Guardrail "Code Quality": fmt.Print* is banned in provider and client code.
      # The reference prototype printed raw API responses to stdout, leaking employee
      # personal data into Terraform logs. Use tflog instead.
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "fmt.Print* is banned: use tflog. Printing API responses leaks personal data into Terraform logs."
      analyze-types: true

  exclusions:
    rules:
      # Test files may print for diagnostic purposes.
      - path: _test\.go
        linters:
          - forbidigo
      # gosec stays ON for tests; only these two rules are silenced there, and
      # only because both are structural false positives in test code:
      # G101 flags dummy tokens in httptest mocks ("kauth-token"), and G304
      # flags layering_test.go reading this repository's own Go files to check
      # their imports. Neither exists outside _test.go.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G304"

formatters:
  enable:
    - gofmt
    - goimports
