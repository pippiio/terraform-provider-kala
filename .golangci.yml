version: "2"

linters:
  enable:
    - errcheck      # GO1.2 — every returned error checked
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - bodyclose     # GO1.1 — every http.Response.Body closed
    - forbidigo     # NFR5 — no fmt.Print* in provider code

  settings:
    forbidigo:
      # Guardrail "Code Quality": fmt.Print* is banned in provider and client code.
      # The reference prototype printed raw API responses to stdout, leaking employee
      # personal data into Terraform logs. Use tflog instead.
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "fmt.Print* is banned (guardrail NFR5): use tflog. Printing API responses leaks personal data into Terraform logs."
      analyze-types: true

  exclusions:
    rules:
      # Test files may print for diagnostic purposes.
      - path: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
